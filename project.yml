name: Meerkat
options:
  bundleIdPrefix: fm.white
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
targets:
  Meerkat:
    type: application
    platform: iOS
    sources:
      - Meerkat
    settings:
      base:
        INFOPLIST_FILE: Meerkat/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: fm.white.meerkat
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Contributors: change this to your own team in Xcode → Signing & Capabilities
        # (or here, then re-run `xcodegen`).
        DEVELOPMENT_TEAM: AD2VN8P4JY
